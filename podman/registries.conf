# Registries config for the lab, used instead of ~/.config/containers/registries.conf.
# scripts/lib.sh points CONTAINERS_REGISTRIES_CONF here, so kind, podman and the
# load balancer controller never read the user-wide file: whatever is in it for
# other work can neither break the lab nor leak into it.
#
# Every image the lab pulls through podman is fully qualified (docker.io/...,
# registry.k8s.io/...), so the only setting needed is where short names resolve.
# Pods inside the cluster pull through each node's containerd and never read this.
unqualified-search-registries = ["docker.io"]
