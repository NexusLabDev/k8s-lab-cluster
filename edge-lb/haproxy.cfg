# Edge load balancer: what a cloud provider would hand you as a Service of
# type LoadBalancer. kind has no cloud controller, so the platform gateways
# are pinned to NodePorts and this proxy publishes them on the laptop.
#
#   host port  ->  NodePort  ->  gateway        hostname
#   8443           30443         public https   *.apps.localhost
#   8080           30080         public http    (301 -> :8443)
#   9443           31443         internal https *.internal.localhost
#   9080           31080         internal http  (301 -> :9443)
#
# mode tcp everywhere. The Istio gateways terminate TLS and route on SNI, so
# this layer must pass bytes through untouched -- terminating here would break
# both the certificate chain and the hostname-based routing.
#
# NodePorts answer on EVERY node regardless of where the gateway pods run
# (externalTrafficPolicy: Cluster), so the control-plane is a valid backend
# even though it is tainted and runs no gateway itself.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode    tcp
    log     global
    option  tcplog
    timeout connect 5s
    timeout client  1m
    timeout server  1m
    # A node that stops answering is pulled out after 3 failed checks (~9s).
    default-server check inter 3s fall 3 rise 2

# --- public gateway: *.apps.localhost ---------------------------------------

frontend public-https
    bind *:8443
    default_backend nodes-public-https

backend nodes-public-https
    balance roundrobin
    server control-plane k8s-lab-control-plane:30443
    server worker        k8s-lab-worker:30443
    # server worker2     k8s-lab-worker2:30443

frontend public-http
    bind *:8080
    default_backend nodes-public-http

backend nodes-public-http
    balance roundrobin
    server control-plane k8s-lab-control-plane:30080
    server worker        k8s-lab-worker:30080
    # server worker2     k8s-lab-worker2:30080

# --- internal gateway: *.internal.localhost ---------------------------------

frontend internal-https
    bind *:9443
    default_backend nodes-internal-https

backend nodes-internal-https
    balance roundrobin
    server control-plane k8s-lab-control-plane:31443
    server worker        k8s-lab-worker:31443
    # server worker2     k8s-lab-worker2:31443

frontend internal-http
    bind *:9080
    default_backend nodes-internal-http

backend nodes-internal-http
    balance roundrobin
    server control-plane k8s-lab-control-plane:31080
    server worker        k8s-lab-worker:31080
    # server worker2     k8s-lab-worker2:31080

# --- observability ----------------------------------------------------------
# http://localhost:8404 -- which nodes are up, per-backend connection counts.

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
